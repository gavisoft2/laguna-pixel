services:
  - type: web
    name: aqua-view
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.19.0
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: TONAPI_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: aqua-view-db
          property: connectionString
databases:
  - name: aqua-view-db
    plan: free
    databaseName: aquaview
    user: aquaview
